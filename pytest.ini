[pytest]
testpaths = tests
# Put the repo root on sys.path so `custom_components.tripshot_tracker` is
# importable however pytest is invoked. `python -m pytest` adds the cwd
# implicitly and a bare `pytest` does not, which made the suite pass locally
# and fail in CI.
pythonpath = .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
